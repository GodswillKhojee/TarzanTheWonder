<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | TarZan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="script.js"></script>
</head>

<body class="bg-[#000] text-white min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="fixed top-0 left-0 w-full bg-black/10 backdrop-blur-2xl px-[10%] py-2 flex justify-between items-center z-10">
    <a href="#" class="text-white text-2xl font-semibold tracking-wide">TarZan</a>
    <nav class="flex space-x-10 text-white text-lg font-light">
      <a href="index.html" class="underline hover:text-gray-400 transition">Home</a>
      <a href="#about" class="hover:text-gray-400 transition">About Us</a>
      <a href="signup.html" class="hover:text-gray-400 transition">Cars</a>
      <a href="contactus.html" class="hover:text-gray-400 transition">Contact Us</a>
      <a href="privacy.html" class="hover:text-gray-400 transition">Privacy Policy</a>
      <a href="services.html" class="hover:text-gray-400 transition">Our Services</a>
    </nav>
  </header>

  <!-- SIGN UP FORM -->
  <main class="flex-1 flex justify-center items-center bg-[#333] py-20 mt-16">
    <form id="signupForm" class="w-full max-w-md bg-black p-8 rounded-2xl shadow-lg space-y-5">
      <h1 class="text-5xl font-bold text-center mb-6">Sign Up</h1>

      <div>
        <label class="block text-sm mb-1">Full Name</label>
        <input type="text" id="fullname" class="w-full bg-[#333] border-b border-gray-500 focus:outline-none py-2 px-1" required />
      </div>

      <div>
        <label class="block text-sm mb-1">Mobile No.</label>
        <div class="flex space-x-2">
          <input type="text" id="mobile" maxlength="10" class="flex-1 bg-[#333] border-b border-gray-500 focus:outline-none py-2 px-1" required />
          <button type="button" id="sendOtpBtn" class="bg-gray-600 hover:bg-gray-700 text-white px-4 rounded-md">Send OTP</button>
        </div>
      </div>

      <div>
        <label class="block text-sm mb-1">OTP</label>
        <input type="text" id="otp" maxlength="6" class="w-full bg-[#333] border-b border-gray-500 focus:outline-none py-2 px-1" required />
      </div>

      <div>
        <label class="block text-sm mb-1">Password</label>
        <input type="password" id="password" class="w-full bg-[#333] border-b border-gray-500 focus:outline-none py-2 px-1" required />
      </div>

      <div>
        <label class="block text-sm mb-1">Confirm Password</label>
        <input type="password" id="confirmPassword" class="w-full bg-[#333] border-b border-gray-500 focus:outline-none py-2 px-1" required />
      </div>

      <div>
        <label class="block text-sm mb-1">State</label>
        <select id="state" class="w-full bg-[#333] border border-gray-600 rounded-md p-2 text-white">
          <option>Select State</option>
          <option>Delhi</option>
          <option>Maharashtra</option>
          <option>Karnataka</option>
        </select>
      </div>

      <div>
        <label class="block text-sm mb-1">City</label>
        <select id="city" class="w-full bg-[#333] border border-gray-600 rounded-md p-2 text-white">
          <option>Select City</option>
          <option>Delhi</option>
          <option>Mumbai</option>
          <option>Bangalore</option>
        </select>
      </div>

      <div>
        <label class="block text-sm mb-1">PIN Code</label>
        <input type="text" id="pincode" maxlength="6" class="w-full bg-[#333] border-b border-gray-500 focus:outline-none py-2 px-1" placeholder="Enter 6-digit PIN" required />
      </div>

      <button type="submit" class="w-full bg-gray-700 hover:bg-gray-800 py-3 rounded-md text-white">Create Account</button>

      <p class="text-center text-gray-400 text-sm mt-3">Already have an account?
        <a href="signin.html" class="text-white underline">Sign In</a>
      </p>
    </form>
  </main>

  <!-- FOOTER -->
  <footer class="w-full bg-black text-white py-10 select-none">
    <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8 px-[10%]">
      <div class="space-y-6">
        <a href="#" class="text-2xl font-semibold tracking-wide block">TarZan</a>
        <div class="space-y-3">
          <p class="text-gray-300">123-456-8790</p>
          <a href="mailto:tarzancars@tarzan.com" class="text-gray-300 hover:text-gray-400 transition">
            tarzancars@tarzan.com
          </a>
          <p class="text-gray-400 leading-relaxed">Address: We are from somewhere on the map of not this world.</p>
        </div>
      </div>

      <div class="flex flex-col items-center md:items-end justify-between space-y-6">
        <a href="#"><img src="assets/Stylized Monkey on Branch Logo.png" alt="Tarzan Logo" class="h-24 w-24 object-contain" /></a>
        <div class="flex space-x-8 text-gray-300">
          <a href="privacy.html" class="hover:text-gray-400 transition">Privacy Policy</a>
          <a href="blog.html" class="hover:text-gray-400 transition">Blog</a>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
